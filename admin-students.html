<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="no-referrer">
  <title>School Students - RK Choice Admin</title>
   <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');</script>
    <link rel="stylesheet" href="src/styles/main.css?v=2.0">
  <link rel="stylesheet" href="src/styles/views/_admin-students.css?v=2.0">
</head>
<body>

    <header class="topbar no-print">
      <div class="min-w-0 flex-1">
        <a href="admin-panel.html" class="logo-link">
          <div class="logo-icon">🎓</div>
          <span id="pageTitle" class="font-semibold text-sm whitespace-normal">School Students</span>
        </a>
      </div>
      <div class="topbar-right flex-shrink-0">
        <a href="admin-panel.html"><button class="secondary">← Back</button></a>
      </div>
    </header>

  <button class="theme-toggle no-print" id="themeToggle">🌙</button>

   <main class="container container-pt">

     <!-- Filter + Actions Card -->
     <div class="card admin-students-card">
        <!-- Row 0: Data type selector -->
        <div class="admin-students-filters-row" style="margin-bottom:0.5rem;">
          <select id="dataTypeFilter" title="Select Data Type" onchange="window.onDataTypeChange()" class="">
            <option value="students">Students</option>
            <option value="teachers">Teachers / Staff</option>
          </select>
        </div>
        <!-- Row 1: Filters -->
        <div class="admin-students-filters-row">
          <select id="schoolFilter" title="Select School" onchange="window.onSchoolFilterChange()" class="">
            <option value="">All Schools</option>
          </select>
          <select id="classFilter" title="Select Class" onchange="window.loadAdminStudents()">
            <option value="">All Classes</option>
          </select>
        </div>
        <!-- Row 2: Actions -->
        <div class="admin-students-actions-row">
          <label class="action-btn select-all-label">
            <input type="checkbox" id="selectAllChk" onchange="window.toggleSelectAll()">
            <span id="selectAllText">Select All</span>
          </label>
          <span id="studentCount" class="action-btn student-count-badge">👥 0 Students</span>
          <button onclick="window.clearAdminFilters()" class="secondary action-btn">Clear Filter</button>
           <button class="btn-print action-btn" onclick="window.adminBulkPrint()">🖨️ Print</button>
           <button class="btn-download action-btn" onclick="window.adminBulkDownload()">📦 Download ZIP</button>
           <button class="btn-csv action-btn" onclick="window.adminExportStudentTeacherWorkbook()">📥 Export Data</button>
        </div>
     </div>

     <div id="loading" class="text-center mt-3">
      <div class="spinner spinner-large"></div>
      <p class="text-muted mt-1">Loading students...</p>
    </div>

    <div id="studentsGrid" class="students-grid hidden"></div>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">📭</div>
      <h3>No Students Found</h3>
      <p>This school has not added any students yet.</p>
    </div>

  </main>

   <!-- JSZip -->
   <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

   <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <!-- Centralized Firebase Configuration -->
    <script src="src/config/firebase-config.js?v=2.0"></script>

    <!-- Utils -->
    <script src="js/helpers.js?v=a94822a"></script>

    <!-- Auth Controller -->
    <script src="js/controllers/auth.controller.js?v=a94822a"></script>

     <!-- Teacher/Staff Data Controller -->
     <script src="js/controllers/teacher-staff-data.controller.js?v=2.0"></script>

     <!-- Admin Students Data Controller -->
     <script src="js/controllers/admin-students-data.controller.js?v=2.0"></script>

     <!-- Admin Students UI Controller -->
     <script src="js/controllers/admin-students-ui.controller.js?v=2.0"></script>

   <!-- Centralized Theme System -->
   <script src="src/js/theme.js?v=2.0"></script>

   <!-- Admin Students Init -->
   <script>if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){window.initAdminStudents();});}else{window.initAdminStudents();}</script>

</body>
</html>
