<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="no-referrer">
  <title>RK Choice - ID Card Management System</title>
   
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
   <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');</script>
   <link rel="stylesheet" href="css/style.css?v=a94822a">
</head>
<body>
 
   <div class="center">
     <div class="glass-card" style="width: 100%; max-width: 350px;">
       
       <div style="text-align: center; margin-bottom: 2rem; position: relative;">
         <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🎓</div>
         <h1 style="margin: 0; color: var(--primary);">RK Choice</h1>
         <p style="color: var(--text-muted); font-size: 14px; margin-top: 0.5rem;">
           ID Card Management System
         </p>
         <!-- Theme toggle -->
         <button id="themeToggle" style="position: absolute; top: 0; right: 0; font-size: 1.5rem; background: none; border: none; cursor: pointer;">🌙</button>
       </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@school.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div id="errorMsg" class="error-msg" style="display: none;"></div>

        <button type="submit" class="full success" id="loginBtn">
          <span class="btn-text">🔐 Sign In</span>
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 12px; color: var(--text-muted);">
        © 2026 RK Choice. All rights reserved.
      </p>
    </div>
  </div>

   <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Initialization -->
    <script src="js/firebase-config.js?v=a94822a"></script>

     <!-- Utils (showToast, sanitize, etc.) -->
     <script src="js/helpers.js?v=a94822a"></script>

    <!-- Auth Controller -->
    <script src="js/controllers/auth.controller.js?v=a94822a"></script>

   <!-- App Entry -->
   <!-- app-new.js removed -->

   <!-- Page-specific script -->
   <script>
     // Login page specific logic
     document.addEventListener('DOMContentLoaded', function() {
       // Check if already logged in
       if (window.isLoggedIn()) {
         window.location.href = window.currentRole === 'admin' ? 'admin-panel.html' : 'dashboard.html';
       }
     });

     // Login form handler
     document.getElementById('loginForm').addEventListener('submit', async function(e) {
       e.preventDefault();

       const btn = document.getElementById('loginBtn');
       const btnText = btn.querySelector('.btn-text');
       const email = document.getElementById('email').value;
       const password = document.getElementById('password').value;
       const errorMsg = document.getElementById('errorMsg');

       btn.disabled = true;
       btnText.textContent = '⏳ Signing in...';
       errorMsg.style.display = 'none';

       try {
         const { user, role } = await window.login(email, password);
         window.showToast('Login successful!', 'success');
         setTimeout(() => {
           window.location.href = role === 'admin' ? 'admin-panel.html' : 'dashboard.html';
         }, 300);
       } catch (error) {
         let message = error.message;
         const code = error.code || '';

         if (code === 'auth/invalid-email') message = 'Invalid email address';
         else if (code === 'auth/user-disabled') message = 'Account disabled';
         else if (code === 'auth/user-not-found') message = 'User not found';
         else if (code === 'auth/wrong-password') message = 'Incorrect password';
         else if (code === 'auth/too-many-requests') message = 'Too many attempts. Try later.';
         else if (code === 'auth/network-request-failed') message = 'Network error. Check connection.';

         errorMsg.textContent = message;
         errorMsg.style.display = 'block';
       } finally {
         btn.disabled = false;
         btnText.textContent = '🔐 Sign In';
       }
     });

     // Theme toggle
     (function() {
       const t = localStorage.getItem('theme') || 'dark';
       document.documentElement.setAttribute('data-theme', t);
       const btn = document.getElementById('themeToggle');
       if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
     })();
     document.getElementById('themeToggle')?.addEventListener('click', function() {
       const current = document.documentElement.getAttribute('data-theme');
       const next = current === 'light' ? 'dark' : 'light';
       document.documentElement.setAttribute('data-theme', next);
       localStorage.setItem('theme', next);
       this.textContent = next === 'light' ? '☀️' : '🌙';
     });
     </script>

</body>
</html>
