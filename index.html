<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="no-referrer">
  <title>RK Choice - ID Card Management System</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function(){
      var theme=localStorage.getItem('theme')||'dark';
      document.documentElement.setAttribute('data-theme',theme);
      // Also set theme toggle button icon immediately to prevent flash
      var toggleBtn=document.getElementById('themeToggle');
      if(toggleBtn) toggleBtn.textContent=theme==='light'?'☀️':'🌙';
    })();
  </script>
  <link rel="stylesheet" href="src/styles/main.css?v=2.0">
  <link rel="stylesheet" href="src/styles/views/_login.css?v=2.0">
  
</head>
<body>
 
  <div class="center">
    <div class="glass-card login-container">
      
      <div class="login-header">
        <span class="icon">🎓</span>
        <h1>RK Choice</h1>
        <p>Professional ID Card Management System</p>
        <button id="themeToggle" class="theme-toggle-login" title="Toggle theme">🌙</button>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">Login ID / Email</label>
          <input type="text" id="email" placeholder="Enter Login ID or Email" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span>🔐</span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="login-footer">
        © 2026 RK Choice. All rights reserved.
      </div>
    </div>
  </div>

   <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

   <!-- Centralized Firebase Configuration -->
   <script src="src/config/firebase-config.js?v=2.0"></script>

   <!-- Utils (showToast, sanitize, etc.) -->
   <script src="js/helpers.js?v=a94822a"></script>

   <!-- Common Functions -->
   <script src="src/js/common-functions.js?v=2.0"></script>

   <!-- Performance Optimization -->
   <script src="src/js/performance.js?v=2.0"></script>

   <!-- Centralized Theme System -->
   <script src="src/js/theme.js?v=2.0"></script>

   <!-- Auth Controller -->
   <script src="js/controllers/auth.controller.js?v=a94822a"></script>

   <!-- Login Page Script -->
   <script src="src/js/pages/login.js?v=2.0"></script>

</body>
</html>
