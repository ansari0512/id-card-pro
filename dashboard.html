<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="no-referrer">
  <title>Dashboard - RK Choice</title>
  
  <link rel="stylesheet" href="src/styles/main.css?v=2.0">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');</script>
  
  <style>
    /* Dashboard specific styles */
    .dashboard-header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 2rem 0 0 0;
    }

    .dashboard-header h1 {
      font-size: 2.25rem;
      margin-bottom: 0.5rem;
    }

    .dashboard-header p {
      color: var(--text-muted);
      font-size: 1rem;
      margin: 0;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      text-align: center;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--info));
      transform: scaleX(0);
      transform-origin: left;
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 12px 24px rgba(59, 130, 246, 0.15);
    }

    .stat-card:hover::before {
      transform: scaleX(1);
    }

    .stat-card .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      display: block;
    }

    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .stat-card .label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    /* Quick Actions */
    .quick-actions-section {
      margin-bottom: 3rem;
    }

    .quick-actions-section h2 {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.25rem;
    }

    .action-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.5rem;
      background: transparent;
      border-radius: var(--radius);
      text-decoration: none;
      cursor: pointer;
      min-height: 160px;
    }

    .action-button.primary {
      --btn-color: var(--btn-primary);
      --btn-color-rgb: var(--btn-primary-rgb);
    }

    .action-button:hover {
      transform: translateY(-4px);
    }

    .action-button .icon {
      font-size: 2.25rem;
    }

    .action-button .label {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }



    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.3s ease;
    }

    .modal h3 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .modal .form-group {
      margin-bottom: 1.5rem;
    }

    .modal .form-group label {
      font-weight: 500;
      color: var(--text-muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal .modal-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .modal .modal-buttons button {
      flex: 1;
      padding: 12px;
    }

    .modal .info-text {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 1rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 12px;
      border-radius: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .dashboard-header {
        margin-bottom: 2rem;
      }

      .dashboard-header h1 {
        font-size: 1.75rem;
      }

      .stats-grid {
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .stat-card {
        padding: 1.25rem;
      }

      .actions-grid {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 1rem;
      }

      .action-button {
        padding: 1.25rem;
        min-height: 140px;
        font-size: 13px;
      }

      .action-button .icon {
        font-size: 2rem;
      }
    }

    @media (max-width: 480px) {
      .dashboard-header {
        margin-bottom: 1.5rem;
        padding: 1rem 0 0 0;
      }

      .dashboard-header h1 {
        font-size: 1.5rem;
      }

      .stats-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .stat-card {
        padding: 1rem;
      }

      .stat-card .value {
        font-size: 1.75rem;
      }

      .stat-card .icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      .actions-grid {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 0.75rem;
      }

      .action-button {
        padding: 1rem;
        min-height: 120px;
        gap: 0.5rem;
        font-size: 12px;
      }

      .action-button .icon {
        font-size: 1.75rem;
      }

      .modal {
        padding: 1.5rem;
        max-width: calc(100% - 1rem);
      }
    }
  </style>
</head>
<body>

   <!-- Topbar -->
   <header class="topbar no-print">
     <div>
       <a href="dashboard.html" style="display:flex;align-items:center;gap:0.5rem;text-decoration:none;color:inherit;">
         <div style="font-size: 1.5rem;">🎓</div>
         <span class="logo-text">RK Choice</span>
       </a>
     </div>
     <div class="topbar-right">
       <span id="userEmail" class="user-email"></span>
       <button class="secondary logout-btn" onclick="window.logout()">Logout</button>
     </div>
   </header>

  <!-- Theme Toggle -->
  <button class="theme-toggle no-print" id="themeToggle">🌙</button>

  <!-- Main Content -->
  <main class="container" style="padding-top: 0;">
    
    <!-- Welcome Message -->
    <div class="dashboard-header">
      <p style="font-size:1rem;color:var(--text-muted);margin:0 0 0.25rem;">Welcome back! 👋</p>
      <h1 id="schoolNameDisplay" style="margin:0 0 0.25rem;"></h1>
      <p>Manage student ID cards with ease</p>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="icon">📇</span>
        <div class="value" id="totalStudents">0</div>
        <div class="label">Total Students</div>
      </div>
      
      <div class="stat-card">
        <span class="icon">🎓</span>
        <div class="value" id="activeStudents">0</div>
        <div class="label">With Photos</div>
      </div>
      
      <div class="stat-card">
        <span class="icon">📦</span>
        <div class="value" id="pendingStudents">0</div>
        <div class="label">Pending Photos</div>
      </div>
    </div>

    <!-- Quick Actions Section -->
    <div class="quick-actions-section">
      <h2>Quick Actions</h2>
      <div class="actions-grid">
        <a href="id-form.html" class="action-button primary">
          <span class="icon">➕</span>
          <span class="label">Create New ID</span>
        </a>
        
        <a href="students.html" class="action-button">
          <span class="icon">👥</span>
          <span class="label">View Students</span>
        </a>
        
        <a href="print.html" class="action-button">
          <span class="icon">🖨️</span>
          <span class="label">Print IDs</span>
        </a>
      </div>
    </div>





  </main>

   <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

   <!-- Firebase Initialization -->
   <script src="js/firebase-config.js?v=a94822a"></script>

   <!-- Utils -->
   <script src="js/helpers.js?v=a94822a"></script>

   <!-- Auth Controller -->
   <script src="js/controllers/auth.controller.js?v=a94822a"></script>

   <!-- Dashboard Controller -->
   <script src="js/controllers/dashboard.controller.js?v=a94822a"></script>

   <!-- Theme & Modal Handler -->
   <script>
     (function() {
       const t = localStorage.getItem('theme') || 'dark';
       document.documentElement.setAttribute('data-theme', t);
       const btn = document.getElementById('themeToggle');
       if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
     })();
     
     document.getElementById('themeToggle')?.addEventListener('click', function() {
       const current = document.documentElement.getAttribute('data-theme');
       const next = current === 'light' ? 'dark' : 'light';
       document.documentElement.setAttribute('data-theme', next);
       localStorage.setItem('theme', next);
       this.textContent = next === 'light' ? '☀️' : '🌙';
     });

     // Modal handlers - removed delete class modal functions
   </script>
</body>
</html>
