<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="no-referrer">
  <title>Create ID Card - RK Choice</title>
   <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'dark');</script>
   <link rel="stylesheet" href="src/styles/main.css?v=2.0">
</head>
<body>

   <!-- Topbar -->
   <header class="topbar no-print">
     <div>
       <a href="dashboard.html" style="display:flex;align-items:center;gap:0.5rem;text-decoration:none;color:inherit;">
         <div style="font-size: 1.5rem;">🎓</div>
         <h2 style="margin: 0;">Create ID Card</h2>
       </a>
     </div>
     <a href="dashboard.html"><button class="secondary">← Back</button></a>
   </header>

  <button class="theme-toggle no-print" id="themeToggle">🌙</button>

  <main class="layout">

    <!-- Left: Form -->
    <div class="form">
      <div class="glass-card">
        <h2 style="margin-top: 0;">Student Information</h2>

        <form id="studentForm">
          <div class="form-row">
            <div class="form-group">
              <label for="name">Student Name *</label>
              <input type="text" id="name" name="name" required maxlength="50" placeholder="Enter full name">
            </div>
            <div class="form-group">
              <label for="father">Father's Name *</label>
              <input type="text" id="father" name="father" required maxlength="50" placeholder="Father's name">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="class">Class *</label>
              <select id="class" name="class" required>
                <option value="">Select Class</option>
                <option value="Nursery">Nursery</option>
                <option value="LKG">LKG</option>
                <option value="UKG">UKG</option>
                <option value="KG">KG</option>
                <option value="1">Class 1</option>
                <option value="2">Class 2</option>
                <option value="3">Class 3</option>
                <option value="4">Class 4</option>
                <option value="5">Class 5</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
              </select>
            </div>
            <div class="form-group">
              <label for="section">Section *</label>
              <select id="section" name="section" required>
                <option value="">Select Section</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="mobile">Mobile Number *</label>
              <input type="tel" id="mobile" name="mobile" required maxlength="10" placeholder="10-digit mobile"
                pattern="[0-9]{10}" inputmode="numeric"
                oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
            </div>
            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" maxlength="200" placeholder="Optional">
            </div>
          </div>

          <div class="form-group">
            <label for="photo">Student Photo *</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>
            <small style="color: var(--text-muted); font-size: 12px;">Max size: 5MB. Recommended: 2x2 inch, 300 DPI</small>
          </div>

          <div id="photoPreview" class="text-center" style="display: none; margin: 1rem 0;">
            <img id="previewImg" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary);">
          </div>

          <button type="submit" class="full success" id="saveBtn" style="margin-top: 1rem;">
            <span class="btn-text">✅ Save & Generate ID</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Right: Live Preview -->
    <div class="preview">
      <div class="id-card-preview" id="idCard">
        <div class="card-header">RK CHOICE ID</div>
        <div class="card-body">
          <img id="cardPhoto" class="photo" src="assets/placeholder.png" alt="Student Photo">
          <h3 id="cardName" style="margin: 10px 0; font-size: 16px; word-break: break-word;">Student Name</h3>
          <div class="info">
            <p><strong>ID:</strong> <span id="cardId">-</span></p>
            <p><strong>Class:</strong> <span id="cardClass">-</span></p>
            <p><strong>Section:</strong> <span id="cardSection">-</span></p>
            <p><strong>Father:</strong> <span id="cardFather">-</span></p>
            <p><strong>Mobile:</strong> <span id="cardMobile">-</span></p>
          </div>
        </div>
      </div>
    </div>

  </main>

   <!-- Firebase SDK -->
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <!-- Firebase Initialization -->
    <script src="js/firebase-config.js?v=a94822a"></script>

    <!-- Utils -->
    <script src="js/helpers.js?v=a94822a"></script>

    <!-- Auth Controller -->
    <script src="js/controllers/auth.controller.js?v=a94822a"></script>

    <!-- ID Form Controller -->
    <script src="js/controllers/id-form.controller.js?v=a94822a"></script>

   <!-- Theme -->
   <script>
     (function() {
       const t = localStorage.getItem('theme') || 'dark';
       document.documentElement.setAttribute('data-theme', t);
       const btn = document.getElementById('themeToggle');
       if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
     })();
     document.getElementById('themeToggle')?.addEventListener('click', function() {
       const current = document.documentElement.getAttribute('data-theme');
       const next = current === 'light' ? 'dark' : 'light';
       document.documentElement.setAttribute('data-theme', next);
       localStorage.setItem('theme', next);
       this.textContent = next === 'light' ? '☀️' : '🌙';
     });
   </script>
